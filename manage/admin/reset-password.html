<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Ashraf Vault</title>
<meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-form-side" style="min-height:100vh;">
  <div class="login-card">
    <h2>Set a new password</h2>
    <p class="subt">Choose a new password for your vault.</p>
    <div class="form-alert" id="form-alert"></div>
    <form id="reset-form">
      <div class="field"><label for="pw1">New password</label><input type="password" id="pw1" minlength="8" required></div>
      <div class="field"><label for="pw2">Confirm password</label><input type="password" id="pw2" minlength="8" required></div>
      <button type="submit" class="btn-signin" id="reset-btn">Update password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  const alertBox = document.getElementById("form-alert");
  function alertMsg(msg, ok) {
    alertBox.textContent = msg; alertBox.classList.add("show");
    alertBox.style.background = ok ? "rgba(52,211,153,0.1)" : "rgba(239,68,68,0.1)";
    alertBox.style.borderColor = ok ? "rgba(52,211,153,0.3)" : "rgba(239,68,68,0.28)";
    alertBox.style.color = ok ? "#5be0ac" : "#fca5a5";
    alertBox.style.border = "1px solid"; alertBox.style.borderRadius = "9px"; alertBox.style.padding = "10px 12px"; alertBox.style.marginBottom = "16px"; alertBox.style.fontSize = "12.5px";
  }
  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw1 = document.getElementById("pw1").value, pw2 = document.getElementById("pw2").value;
    if (pw1.length < 8) return alertMsg("Password must be at least 8 characters.", false);
    if (pw1 !== pw2) return alertMsg("Passwords don't match.", false);
    const { error } = await window.sb.auth.updateUser({ password: pw1 });
    if (error) return alertMsg(error.message, false);
    alertMsg("Password updated. Redirecting to sign in…", true);
    setTimeout(() => window.location.href = "login.html", 1500);
  });
</script>
</body>
</html>
